name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Chromium and its system libraries come preinstalled. The tag must match @playwright/test in
    # package-lock.json; a mismatch fails loudly with a missing browser executable.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    strategy:
      fail-fast: false
      matrix:
        # SwiftShader is CPU-bound, so each machine runs one worker; spread the suite across machines.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7
